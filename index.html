<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Garde-robe">
<title>Garde-robe chromatique</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icones/icone-180.png">
<link rel="icon" type="image/png" href="icones/icone-192.png">
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/app.js"></script>
</head>
<body data-etat="chargement">
<div id="annonces" class="annonces" aria-live="polite" popover="manual"></div>
<p id="bandeau" class="bandeau" role="alert" hidden>Stockage local inaccessible (données de site bloquées dans les réglages du navigateur) : rien de ce que tu saisis ne sera enregistré.</p>
<main id="contenu" class="contenu">
  <p class="discret">Chargement…</p>
</main>
<div id="nouvelle-version" class="nouvelle-version" role="status" hidden>
  <span>Nouvelle version disponible.</span>
  <button type="button" class="bouton petit principal" id="recharger-version">Recharger</button>
</div>
<nav id="onglets" class="onglets" aria-label="Écrans" hidden>
  <button type="button" data-ecran="garde-robe">Garde-robe</button>
  <button type="button" data-ecran="tenue">Tenue</button>
  <button type="button" data-ecran="manques">Manques</button>
  <button type="button" data-ecran="reglages">Réglages</button>
</nav>
<noscript><p class="vide">Cette app a besoin de JavaScript.</p></noscript>
</body>
</html>
